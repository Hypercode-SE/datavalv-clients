[project]
name = "datavalv-client"
version = "0.7.0"
description = "Client library for pushing end-to-end encrypted backups to Datavalv"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["cryptography>=44", "httpx>=0.28", "pyjwt[crypto]>=2.10"]
# No email. The package is a company's, not a person's, and a maintainer's
# address in package metadata is an address in every mirror of it forever.
authors = [{ name = "Hypercode AB" }]
keywords = ["backup", "encryption", "end-to-end", "datavalv"]

# MIT, because this is the half of Datavalv that runs on somebody else's
# server: a customer who cannot read, audit and vendor the code that encrypts
# their backups has to take the encryption on trust, which is the opposite of
# what the product claims. It says nothing about the service, which is not
# open source.
license = "MIT"
license-files = ["LICENSE"]

# No `License ::` classifier: PEP 639 deprecated them in favour of the SPDX
# expression above, and a package that carries both is rejected on upload.
classifiers = [
    # 0.1.0, and nothing has pushed a backup to production with it yet.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # POSIX rather than OS Independent. `datavalv keygen` promises a key file
    # that never exists readable by anyone but its owner, and that promise is
    # `os.open(..., 0o600)` — a mode Windows does not implement.
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://datavalv.se"
# The operator's guide these steps mirror. If the two ever disagree, that page
# is the one a customer read.
Documentation = "https://datavalv.se/connect-system"
Source = "https://github.com/Hypercode-SE/datavalv-clients"
# On the public mirror, because the wheel carries the README and not this.
Changelog = "https://github.com/Hypercode-SE/datavalv-clients/blob/main/client/CHANGELOG.md"

[project.scripts]
# `main` returns an exit code rather than raising SystemExit, which is what the
# console-script shim expects: it calls this and exits with what comes back.
# The codes are a documented surface -- 5 means "nothing is wrong, run it again
# later" -- so a schedule can branch on them. `cli._EXIT_TABLE` is the list.
datavalv = "datavalv_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datavalv_client"]
# `_format_constants.py` is generated by `scripts/gen_constants.py` and
# committed, so hatchling's default selection — everything git does not ignore
# — already carries it. It is named here as well because the failure it
# guards against is silent: a wheel without it installs cleanly and raises
# ImportError on `import datavalv_client`, and the obvious tidy-up of adding a
# generated file to .gitignore is all it would take. `artifacts` includes a
# path even when the VCS ignores it.
artifacts = ["src/datavalv_client/_format_constants.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
